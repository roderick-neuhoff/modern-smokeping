<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SmokePing</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app">

  <header class="topbar">
    <button class="iconbtn only-mobile" id="menuToggle" aria-label="Toggle target list" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="brand" href="#/">
      <img src="favicon.svg" width="24" height="24" alt="">
      <span>SmokePing</span>
      <em id="brandOwner"></em>
    </a>

    <nav class="statuspills" id="statusPills" aria-label="Network status summary"></nav>

    <div class="topbar-tools">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Filter targets" autocomplete="off" spellcheck="false">
      </label>
      <button class="iconbtn" id="refreshBtn" title="Refresh now" aria-label="Refresh now">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
        <span class="refresh-count" id="refreshCount"></span>
      </button>
      <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar" aria-label="Targets">
      <div class="tree" id="tree"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main" id="main" tabindex="-1">
      <div class="loading" id="bootLoading">Loading…</div>
    </main>
  </div>

  <div class="offline-banner" id="offlineBanner" hidden role="status" aria-live="polite">
    <div>
      <strong>API unreachable.</strong> Data shown may be stale.
      <div class="offline-detail" id="offlineDetail"></div>
    </div>
    <button id="offlineRetry">Retry</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
