name: Build and publish Docker image

# Publishes modern-smokeping to GitHub Container Registry (ghcr.io) so hosts
# (Unraid, Synology, ...) can just pull a tag instead of building locally -
# also sidesteps the buildx-on-Unraid issue since nothing builds on the host
# anymore. Uses the built-in GITHUB_TOKEN - no extra secrets needed to push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      base_tag:
        description: "lscr.io/linuxserver/smokeping tag to build on"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # Which lscr.io/linuxserver/smokeping tag to build FROM. Priority:
      # manual workflow_dispatch input > repo variable (Settings > Secrets
      # and variables > Actions > Variables > BASE_TAG) > "latest".
      BASE_TAG: ${{ inputs.base_tag || vars.BASE_TAG || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/modern-smokeping
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Shown in the UI itself (topbar + wallboard, see Dockerfile) - a
      # version tag becomes "1.2.3", a plain push to main becomes
      # "latest-<short sha>" so a running "latest" can still be traced back
      # to the exact build.
      - id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=modern-smokeping
          cache-to: type=gha,mode=max,scope=modern-smokeping

  # Only for an actual version tag push (v1.2.3, not a plain push to main) -
  # creates the GitHub Release page with auto-generated notes.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
