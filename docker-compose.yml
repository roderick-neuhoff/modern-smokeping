# modern-smokeping - drop-in replacement for the LinuxServer.io SmokePing
# container. Same volumes, same behaviour, plus a modern UI at / and /modern/
# and a JSON API at /api/.
#
# Image is built by GitHub Actions and published to ghcr.io on every push to
# main (tag "latest") and every version tag (v1.2.3 -> tags 1.2.3, 1.2, 1) -
# see .github/workflows/docker-publish.yml. Set IMAGE_TAG in .env to pin a
# version; deploy.sh just pulls it, nothing is built on the host.

services:
  smokeping:
    image: ghcr.io/roderick-neuhoff/modern-smokeping:${IMAGE_TAG:-latest}
    container_name: smokeping
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Europe/Amsterdam}
      # Password for the Settings page and every write (config, acks, tests,
      # reload). Viewing stays open. WEBUI_AUTH=off disables it.
      # Leave WEBUI_PASS empty to have one generated on first start - it is
      # printed in the container log and kept in /config/modern-auth/password.txt
      - WEBUI_AUTH=${WEBUI_AUTH:-on}
      - WEBUI_USER=${WEBUI_USER:-admin}
      - WEBUI_PASS=${WEBUI_PASS:-}
      # Optional: point the alerts "history" panel at a specific log file.
      # Defaults to /config/log/smokeping.log which the bundled svc override fills.
      # - SMOKEPING_LOG=/config/log/smokeping.log
    volumes:
      - ${CONFIG_DIR:-./data/config}:/config
      - ${DATA_DIR:-./data/data}:/data
    ports:
      - ${HTTP_PORT:-8480}:80
    restart: unless-stopped
