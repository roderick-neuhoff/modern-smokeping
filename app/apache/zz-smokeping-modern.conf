# SmokePing Modern UI - Apache glue.
# Installed to /config/site-confs/ by /custom-cont-init.d/50-smokeping-modern.
# The "zz-" prefix makes it load after smokeping.conf, which is where the base
# image does `LoadModule fcgid_module`.

# --- static SPA -------------------------------------------------------
Alias /modern /app/smokeping-modern/web
<Directory "/app/smokeping-modern/web">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    AddType text/javascript .js
    AddType image/svg+xml .svg
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache"
    </IfModule>
</Directory>

# --- JSON API -------------------------------------------------------
# /api/<route> reaches the single script as PATH_INFO.
ScriptAlias /api /app/smokeping-modern/api/smokeping-api.cgi
<Directory "/app/smokeping-modern/api">
    AllowOverride None
    Options +ExecCGI +FollowSymLinks
    Require all granted
    AcceptPathInfo On
    <IfModule mod_fcgid.c>
        SetHandler fcgid-script
    </IfModule>
    <IfModule !mod_fcgid.c>
        SetHandler cgi-script
    </IfModule>
</Directory>

<IfModule mod_fcgid.c>
    # one worker parses the SmokePing config and then serves many requests
    FcgidMaxRequestsPerProcess 500
    FcgidIOTimeout 90
    FcgidIdleTimeout 300
    FcgidMaxRequestLen 1048576
</IfModule>

# --- login (basic auth) -----------------------------------------------
# /config/site-confs/modern-auth.inc is written by the init script when
# WEBUI_AUTH is not "off". It protects /modern, /api and the classic UI.
IncludeOptional /config/site-confs/modern-auth.inc

# --- make the modern UI the landing page ----------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule   ^/?$                    /modern/                  [R=302,L]
    RewriteRule   ^/smokeping/?$          /modern/                  [R=302,L]
    RewriteRule   ^/smokeping/legacy/?$   /smokeping/smokeping.cgi  [R=302,L]
</IfModule>
